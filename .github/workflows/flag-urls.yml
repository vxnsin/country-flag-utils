name: Flag URLs

# The flag images come from an external provider, so this runs on a schedule
# instead of on every push.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check:urls
      - run: npm run check:urls -- --provider flagcdn --format svg
